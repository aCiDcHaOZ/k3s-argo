apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: gitea
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-static
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-secret
  namespace: gitea
type: Opaque
stringData:
  GITEA__security__SECRET_KEY: "vervang-dit-met-een-lange-random-string"
  GITEA__security__INTERNAL_TOKEN: "nog-een-lange-random-string"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      securityContext:
        fsGroup: 1000

      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/gitea && chown -R 1000:1000 /var/lib/gitea
          volumeMounts:
            - name: gitea-data
              mountPath: /var/lib/gitea

      containers:
        - name: gitea
          image: docker.gitea.com/gitea:1.25.5-rootless
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222

          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"

            # 🌐 server config
            - name: GITEA__server__DOMAIN
              value: "gitea.local"
            - name: GITEA__server__ROOT_URL
              value: "http://gitea.local/"
            - name: GITEA__server__SSH_DOMAIN
              value: "gitea.local"
            - name: GITEA__server__SSH_PORT
              value: "2222"
            - name: GITEA__server__START_SSH_SERVER
              value: "true"

            # 🗄️ SQLite database
            - name: GITEA__database__DB_TYPE
              value: "sqlite3"

            # 🔐 security
            - name: GITEA__security__INSTALL_LOCK
              value: "true"

            - name: GITEA__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gitea-secret
                  key: GITEA__security__SECRET_KEY

            - name: GITEA__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-secret
                  key: GITEA__security__INTERNAL_TOKEN

          volumeMounts:
            - name: gitea-data
              mountPath: /var/lib/gitea
            - name: gitea-config
              mountPath: /etc/gitea

          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 180
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 10

      volumes:
        - name: gitea-data
          persistentVolumeClaim:
            claimName: gitea-data
        - name: gitea-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: ssh
      port: 2222
      targetPort: ssh
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
  namespace: gitea
spec:
  ingressClassName: traefik
  rules:
    - host: gitea.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea
                port:
                  number: 3000
