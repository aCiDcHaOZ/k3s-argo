apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-runner
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://git.onlionel.com/lionel/k3s_gitops.git
    targetRevision: main
    path: apps/gitea-runner

  destination:
    server: https://kubernetes.default.svc
    namespace: gitea

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
