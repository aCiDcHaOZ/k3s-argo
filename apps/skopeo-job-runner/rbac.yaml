apiVersion: v1
kind: ServiceAccount
metadata:
  name: skopeo-job-runner
  namespace: semaphore

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skopeo-job-runner
  namespace: semaphore
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skopeo-job-runner
  namespace: semaphore
subjects:
  - kind: ServiceAccount
    name: semaphore   # 👈 gebruik jouw bestaande SA hier
    namespace: semaphore
roleRef:
  kind: Role
  name: skopeo-job-runner
  apiGroup: rbac.authorization.k8s.io
