apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skopeo-job-runner
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/aCiDcHaOZ/k3s-argo.git
    targetRevision: main
    path: apps/skopeo-job-runner

  destination:
    server: https://kubernetes.default.svc
    namespace: semaphore

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
