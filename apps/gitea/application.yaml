apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: "12.3.0"
    helm:
      valuesObject:
        persistence:
          enabled: true
          size: 20Gi
          storageClass: longhorn-static

        postgresql:
          enabled: true
          image:
            registry: docker.io
            repository: bitnamilegacy/postgresql
            tag: 17.6.0-debian-12-r4
          primary:
            persistence:
              enabled: true
              size: 10Gi
              storageClass: longhorn-static

        postgresql-ha:
          enabled: false

        valkey-cluster:
          enabled: false

        redis-cluster:
          enabled: false

        redis:
          enabled: false

        service:
          http:
            type: ClusterIP
          ssh:
            type: NodePort
            nodePort: 30222

        ingress:
          enabled: true
          className: traefik
          hosts:
            - host: gitea.local
              paths:
                - path: /
                  pathType: Prefix

        gitea:
          admin:
            existingSecret: gitea-admin-secret
            usernameKey: username
            passwordKey: password
            emailKey: email

  destination:
    server: https://kubernetes.default.svc
    namespace: gitea

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
